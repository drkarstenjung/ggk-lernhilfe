      <path d="M252 134 Q252 116 248 112 L234 120"/>
      <path d="M272 134 Q273 122 270 118 L256 126"/>
      <path d="M312 132 L312 102"/>
      <path d="M312 110 L334 94"/>
    </g>
    <circle cx="312" cy="90" r="9"/>
    <path d="M312 104 L292 92 L296 114 Z"/>
    <circle cx="338" cy="88" r="9" fill="none" stroke="#C9A24B" stroke-width="5"/>
    <rect x="296" y="128" width="30" height="24" rx="4"/>
    <circle cx="312" cy="150" r="14"/>
    <circle cx="312" cy="150" r="6" fill="#14284B"/>
    <!-- Attika -->
    <rect x="112" y="160" width="288" height="40" rx="2"/>
    <rect x="100" y="200" width="312" height="16"/>
    <rect x="92" y="216" width="328" height="12"/>
    <!-- Säulen: sechs Stück, fünf Durchgänge (mittlerer breiter) -->
