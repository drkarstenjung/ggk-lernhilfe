<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>GGK-Lernhilfe</title>
  <rect width="512" height="512" rx="96" fill="#14284B"/>
  <g fill="#C9A24B" transform="translate(0,14)">
