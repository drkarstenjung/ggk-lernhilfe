      <rect x="104" y="228" width="24" height="132"/>
      <rect x="156" y="228" width="24" height="132"/>
      <rect x="208" y="228" width="24" height="132"/>
      <rect x="280" y="228" width="24" height="132"/>
      <rect x="332" y="228" width="24" height="132"/>
      <rect x="384" y="228" width="24" height="132"/>
    </g>
    <!-- Stufen -->
    <rect x="92" y="360" width="328" height="12"/>
    <rect x="80" y="372" width="352" height="12"/>
  </g>
  <!-- feine Fugen im Gebälk -->
  <g stroke="#14284B" stroke-width="3" opacity=".7" transform="translate(0,14)">
    <line x1="112" y1="180" x2="400" y2="180"/>
    <line x1="92" y1="216" x2="420" y2="216"/>
